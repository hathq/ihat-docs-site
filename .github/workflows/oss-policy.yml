name: OSS policy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: oss-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify repository policy
        run: python3 .github/oss-policy-check.py
