name: Site source acceptance
on:
  pull_request:
  push:
    branches: [main, 'coela/**']
permissions:
  contents: read
jobs:
  site-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.29.3
      - name: Resolve the committed official dependency tree
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/site-store" --registry=https://registry.npmjs.org
      - name: Verify active reviewed dependency backports
        run: pnpm exec nuxtjp-security-check --project-root .
      - run: pnpm validate:content
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
