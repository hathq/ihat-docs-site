name: Site source acceptance
on:
  pull_request:
  push:
    branches: [main, 'coela/**']
permissions:
  contents: read
jobs:
  site-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.29.3
      - name: Resolve the committed official dependency tree
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/site-store" --registry=https://registry.npmjs.org
      - run: pnpm validate:content
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
