name: Prepare and release one main site
on:
  workflow_call:
    inputs:
      site:
        required: true
        type: string
      source-sha:
        required: true
        type: string
env:
  SITE_RELEASE_MODE: main
  SITE_RELEASE_ID: ${{ inputs.site }}
  SITE_RELEASE_SOURCE_SHA: ${{ inputs.source-sha }}
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          python3 .github/scripts/test_site_release.py
          python3 .github/scripts/test_site_transport.py
        env:
          SITE_RELEASE_MODE: tag
  prepare:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.archive.outputs.sha256 }}
      app: ${{ steps.plan.outputs.app }}
      install: ${{ steps.plan.outputs.install }}
      deploy-enabled: ${{ steps.plan.outputs.deploy-enabled }}
      environment: ${{ steps.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require current main and successful owner CI
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 18); do
            if python3 .github/scripts/site_release.py plan; then exit 0; fi
            sleep 10
          done
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.29.3
      - name: Build selected site without deployment credentials
        env:
          SITE_RELEASE_ID: ${{ steps.plan.outputs.site }}
          SITE_RELEASE_APP: ${{ steps.plan.outputs.app }}
          NUXT_TELEMETRY_DISABLED: '1'
        run: |
          python3 .github/scripts/site_build.py "$SITE_RELEASE_ID" "$SITE_RELEASE_APP"
          git diff --exit-code
      - name: Bind source, target and all public asset hashes
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/site_release.py pack "$RUNNER_TEMP/site-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: site-main-release-${{ inputs.site }}-${{ inputs.source-sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/site-release/site.tgz
            ${{ runner.temp }}/site-release/SHA256SUMS
          retention-days: 90
          if-no-files-found: error
      - name: Describe publication gate
        env:
          SITE_DEPLOY_ENABLED: ${{ vars.SITE_DEPLOY_ENABLED }}
          RELEASE_HASH: ${{ steps.archive.outputs.sha256 }}
        run: |
          printf 'Prepared source `%s`, archive SHA256 `%s`.\n' "$SITE_RELEASE_SOURCE_SHA" "$RELEASE_HASH" >> "$GITHUB_STEP_SUMMARY"
          if test "$SITE_DEPLOY_ENABLED" != true; then
            echo 'NOT DEPLOYED: configure reviewed site production Environment, effective required reviewers and its CLOUDFLARE_DEPLOY_TOKEN; then set SITE_DEPLOY_ENABLED=true. Private plan limitations must be resolved first.' >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    needs: prepare
    concurrency:
      group: site-deploy-${{ github.repository }}-${{ needs.prepare.outputs.environment }}
      cancel-in-progress: false
    if: vars.SITE_DEPLOY_ENABLED == 'true' && vars.SITE_AUTO_MAIN_DEPLOY_ENABLED == 'true' && needs.prepare.outputs.deploy-enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.29.3
      - name: Install only the owning locked deployment toolchain without Cloudflare credentials
        env:
          SITE_RELEASE_APP: ${{ needs.prepare.outputs.install }}
        run: pnpm --dir "$SITE_RELEASE_APP" install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/site-release
      - name: Deploy exact archive and verify production; never create a public preview
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.prepare.outputs.sha256 }}
          WRANGLER_SEND_METRICS: 'false'
        run: python3 .github/scripts/site_release.py deploy "$RUNNER_TEMP/site-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: site-main-receipt-${{ inputs.site }}-${{ inputs.source-sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/site-release/rollback.json
            ${{ runner.temp }}/site-release/acceptance.json
            ${{ runner.temp }}/site-release/operation.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Summarize verified production
        run: cat "$RUNNER_TEMP/site-release/acceptance.json" >> "$GITHUB_STEP_SUMMARY"
